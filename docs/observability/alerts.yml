# Prometheus alerting-rules voor het ZZP Platform — drop-in monitoring voor /api/metrics.
#
# Deze regels vertalen de gauges die /api/metrics exposeert (Prometheus-tekst, beveiligd met
# `Authorization: Bearer $CRON_SECRET`) naar concrete alerts met drempels en `for:`-duur. Ze horen bij
# src/lib/observability/metrics.ts; een drift-gate-test (src/lib/observability/alerts-rules.test.ts)
# klinkt de hieronder gebruikte `zzp_*`-namen vast aan de daadwerkelijk geëxposeerde gauges, zodat een
# hernoemde/verwijderde gauge (dode alert) of een nieuwe gauge zonder alert de CI-poort breekt.
#
# GEBRUIK (Prometheus): scrape /api/metrics met de CRON_SECRET als bearer, bv.
#
#   scrape_configs:
#     - job_name: zzp-platform
#       metrics_path: /api/metrics
#       scheme: https
#       authorization: { type: Bearer, credentials: "<CRON_SECRET>" }
#       static_configs: [{ targets: ["jouwdomein.nl"] }]
#
#   rule_files: [ "alerts.yml" ]
#
# Laad dit bestand via `rule_files`. Een uptime-dienst met body-check kan dezelfde drempels handmatig
# spiegelen. De gauges bevatten NOOIT persoonsgegevens — alleen geaggregeerde tellingen/leeftijden/vlaggen.
#
# SCRAPE-DEADMAN: alle waarde-alerts hieronder evalueren over de gescrapete gauges. Valt de scrape zelf
# weg (app down, endpoint 503, geroteerde CRON_SECRET, netwerk/TLS), dan is er geen data en vuurt geen
# van die alerts. `ZzpTargetDown` (up == 0) en `ZzpMetricsAbsent` (absent(zzp_up)) dekken juist die
# totale-storing-blinde-vlek — zonder hen is de hele bundle stil blind bij de ergste storing.
#
# ONDERHOUD (inhibitie): `zzp_maintenance_mode == 1` betekent bewust onderhoud (bezoekers krijgen 503).
# Onderdruk dan de beschikbaarheidsalerts met een inhibit_rule op die gauge, zodat een geplande deploy
# niet paget — en een per ongeluk aan-gelaten onderhoudsmodus juist wél zichtbaar blijft via
# ZzpMaintenanceModeOn (waarschuwing).

groups:
  - name: zzp-platform-beschikbaarheid
    rules:
      - alert: ZzpTargetDown
        # Scrape-/target-niveau deadman: Prometheus kon /api/metrics niet scrapen (app down, endpoint
        # 503, geroteerde/verkeerde CRON_SECRET, TLS-/netwerkfout). ZONDER deze alert vuurt bij een
        # totale storing GEEN van de zzp_*-alerts — die evalueren over de gescrapete gauges, en bij een
        # mislukte scrape is er geen data; de hele bundle wordt dan stil blind, precies de faalmodus die
        # het metrics-werk juist wil dichten. `up` is Prometheus' eigen scrape-metric (1=ok, 0=faal),
        # geen zzp_-gauge — vandaar dat de drift-gate-test ZzpTargetDown als target-niveau-alert kent.
        expr: up{job="zzp-platform"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Metrics-endpoint onbereikbaar (scrape faalt)"
          description: "Prometheus kan /api/metrics niet scrapen (up=0): de app is onbereikbaar, geeft een fout, of de CRON_SECRET klopt niet. Geen enkele operationele alert kan nu vuren. `for: 5m` overbrugt een normale deploy-blip. Zie RUNBOOK §6 (incident-respons)."
      - alert: ZzpMetricsAbsent
        # Complement op ZzpTargetDown: de scrape lukt (of het target bestaat) maar de zzp_up-reeks
        # ontbreekt volledig — de metrics-handler produceert geen gauges (regressie) of levert een 200
        # met lege/verkeerde body. up==0 mist dit (endpoint kan 200 geven terwijl de payload leeg is);
        # `absent(zzp_up)` = 1 zodra de reeks niet bestaat. zzp_up is een echte gauge (INFO_ONLY).
        expr: absent(zzp_up)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Metrics-gauges afwezig"
          description: "De zzp_up-gauge ontbreekt volledig in Prometheus: de metrics-handler levert geen gauges (regressie) of het target is langdurig down. Alle waarde-gebaseerde alerts zijn dan blind. Zie RUNBOOK §6."
      - alert: ZzpDatabaseUnreachable
        # Liveness: de metrics-handler kon geen `SELECT 1` doen. Directe klantimpact.
        expr: zzp_db_reachable == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Database onbereikbaar"
          description: "De app kan de database niet bereiken (zzp_db_reachable=0). Zie RUNBOOK §6 (incident-respons)."

  - name: zzp-platform-dead-mans-switch
    rules:
      - alert: ZzpCronStale
        # De geplande-taken-cron draaide langer dan CRON_MAX_AGE_HOURS niet: expiry-detectie,
        # abonnement-verval, retentie-snoei liggen dan stil. Server-side tegen het venster berekend.
        expr: zzp_cron_heartbeat_stale == 1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Geplande-taken-cron staat stil"
          description: "De cron-heartbeat is buiten het venster (CRON_MAX_AGE_HOURS). Geplande runners draaien niet meer. Controleer de cron-workflow/secret. Zie MENSENWERK §10."
      - alert: ZzpCronLastRunFailed
        # De cron draaide wél, maar de laatste run had een taakfout. `zzp_up`-scrape bewijst dat de app
        # leeft; deze gauge is 0 alleen na een echte run-fout (nooit-gedraaid telt ook als 0, vandaar `for`).
        expr: zzp_cron_heartbeat_ok == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Laatste cron-run faalde"
          description: "De laatste geplande-taken-run rapporteerde een taakfout (zzp_cron_heartbeat_ok=0). Bekijk de run-all-logs. Welke runner faalde staat in ZzpCronTaskFailed (`task`-label)."
      - alert: ZzpCronTaskFailed
        # Per-runner-attributie bij een gefaalde cron-run: WELKE geplande-taak-runner faalde. Vuurt samen
        # met ZzpCronLastRunFailed (aggregaat 0/1), maar draagt het `task`-label zodat de operator direct
        # de vastgelopen runner ziet — zonder op /admin/systeemstatus in te loggen of de run-all-logs te
        # grepen. Alleen gefaalde runners exposeren een reeks (waarde altijd 1); bij een geslaagde run is
        # er geen enkele, dus dooft de alert vanzelf. `for` spiegelt ZzpCronLastRunFailed (30m dempt de
        # nooit-gedraaid/transient-flap tussen twee runs).
        expr: zzp_cron_task_failed == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Cron-runner {{ $labels.task }} faalde in de laatste run"
          description: "De geplande-taak-runner `{{ $labels.task }}` faalde tijdens de laatste run-all. Bekijk de run-all-logs (of Sentry, indien geconfigureerd) voor het foutdetail van díe runner. Zie RUNBOOK §6."
      - alert: ZzpBackupStale
        # De externe database-back-up meldde langer dan BACKUP_MAX_AGE_HOURS geen succes: het
        # back-up-schema lijkt gestopt (opgezegde snapshot-policy, mislukte dump). Dataverlies-risico.
        expr: zzp_backup_heartbeat_stale == 1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Database-back-up staat stil"
          description: "De back-up-heartbeat is buiten het venster (BACKUP_MAX_AGE_HOURS) of meldde nog nooit succes. Controleer het back-up-schema. Zie RUNBOOK §5 / MENSENWERK §11.1b."
      - alert: ZzpBackupLastFailed
        expr: zzp_backup_heartbeat_ok == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Laatste database-back-up faalde"
          description: "De laatste gemelde database-back-up slaagde niet (zzp_backup_heartbeat_ok=0). Controleer de dump-job."
      - alert: ZzpMailDeliveryFailing
        # Het e-mailkanaal (EMAIL_DRIVER=smtp/resend/postmark/ses) wijst systematisch af: de laatste
        # verzending mislukte (zzp_mail_delivery_ok=0) én er zijn ≥3 opeenvolgende mislukkingen. E-mail is
        # event-gedreven (geen staleness-op-leeftijd), dus de conditie zit op de teller, niet op ouderdom.
        # Oorzaak meestal een verlopen provider-sleutel, gede-verifieerd domein, geschorst account of harde
        # rate-limit — élke notificatie/wachtwoordherstel/herinnering mislukt dan stil. De ≥3-drempel +
        # `for:` negeren één transiënte bounce. Herstel wordt automatisch gewist zodra een verzending slaagt
        # (of draai de E-mail-zelftest op /admin/systeemstatus). Zie MENSENWERK §2.
        expr: zzp_mail_delivery_ok == 0 and zzp_mail_consecutive_failures >= 3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "E-mailkanaal wijst af"
          description: "Het e-mailkanaal levert niet meer af (zzp_mail_delivery_ok=0, ≥3 opeenvolgende mislukkingen). Notificaties, wachtwoordherstel en herinneringen komen niet aan. Controleer de provider-sleutel/domeinverificatie en het server-logboek (of Sentry). Zie MENSENWERK §2."

      - alert: ZzpPushDeliveryFailing
        # Het web-push-kanaal (VAPID/PWA-pushmeldingen) wijst systematisch af: de laatste afleverronde
        # leverde niets af (zzp_push_delivery_ok=0) én er zijn ≥3 opeenvolgende mislukte rondes. Push is
        # event-gedreven (geen staleness-op-leeftijd), dus de conditie zit op de teller, niet op ouderdom.
        # Oorzaak meestal geroteerde/verlopen VAPID-sleutels of een provider-storing — élke pushmelding
        # mislukt dan stil. Verlopen abonnementen (churn, 404/410) tellen NIET mee: alleen echte, actieve
        # endpoints die niets ontvingen. De ≥3-drempel + `for:` negeren één transiënte fout. Herstel wordt
        # automatisch gewist zodra een afleverronde weer aankomt. Zie MENSENWERK §0b (web-push).
        expr: zzp_push_delivery_ok == 0 and zzp_push_consecutive_failures >= 3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Web-push-kanaal wijst af"
          description: "Het web-push-kanaal levert niet meer af (zzp_push_delivery_ok=0, ≥3 opeenvolgende mislukte afleverrondes). Pushmeldingen komen niet aan op actieve abonnementen. Controleer de VAPID-sleutels (geroteerd/verlopen), het VAPID-subject en het server-logboek (of Sentry). Zie MENSENWERK §0b."

  - name: zzp-platform-stille-faal-backlogs
    rules:
      # Deze drie tellen werk dat een cron-run HAD moeten doen. De cron-heartbeat bewijst alleen DÁT de
      # run afrondde, niet DÁT 'ie zijn werk deed. Een klein, tijdelijk aantal is normaal: een credential/
      # abonnement dat kort ná de 05:00-run verloopt, blijft tot de volgende dagelijkse run "overdue".
      # Daarom een ruime `for:` (> één cron-interval + speling) zodat alleen een AANHOUDENDE backlog paget.
      - alert: ZzpCredentialExpiryBacklog
        expr: zzp_credentials_overdue_expiry > 0
        for: 30h
        labels:
          severity: warning
        annotations:
          summary: "Credential-expiry-pijplijn verwerkt niets"
          description: "Er staan al > één cron-interval VERIFIED-credentials met een verstreken vervaldatum die niet naar EXPIRED zijn gezet (zzp_credentials_overdue_expiry). De expiry-cron rondt af maar verwerkt niets."
      - alert: ZzpSubscriptionExpiryBacklog
        expr: zzp_subscriptions_overdue_expiry > 0
        for: 30h
        labels:
          severity: warning
        annotations:
          summary: "Abonnement-verval-pijplijn verwerkt niets"
          description: "Er staan al > één cron-interval betaalde ACTIVE-abonnementen met een verstreken periode-einde die niet naar CANCELLED zijn gezet (zzp_subscriptions_overdue_expiry). De entitlement-guard dekt de toegang af, maar verval/renewal (notificaties, ledger) ligt stil."
      - alert: ZzpSubscriptionsStalePending
        # Anders dan de andere backlogs bewaakt deze alert GEEN cron maar de betaal-WEBHOOK: een betaalde
        # checkout upsert een abonnement naar PENDING, en alleen de webhook tilt 'm daarna naar ACTIVE
        # (paid) of PAST_DUE (failed) — er is geen cron die PENDING verwerkt. Een enkele PENDING-rij is een
        # verlaten checkout (ruis), maar een stil kapotte webhook (verkeerde callback-URL, handtekening-
        # mismatch, geblokkeerde poort) laat ÉLKE checkout op PENDING staan → niemand wordt geactiveerd en
        # de platform-omzet lekt stil weg. De gauge telt alleen rijen ouder dan het venster
        # (SUBSCRIPTION_PENDING_STALE_HOURS, default 24u — ruim voor instant-methodes zoals iDEAL/kaart);
        # de ruime `for:` zorgt dat alleen een AANHOUDENDE achterstand paget, niet één trage betaling.
        # Met de mock-provider (pilot-default) bestaat er nooit een PENDING-rij en vuurt deze alert nooit.
        expr: zzp_subscriptions_stale_pending > 0
        for: 30h
        labels:
          severity: warning
        annotations:
          summary: "Abonnement-activatie via de betaal-webhook verwerkt niets"
          description: "Er hangen al > één cron-interval abonnementen langer dan het venster (SUBSCRIPTION_PENDING_STALE_HOURS) in status PENDING (zzp_subscriptions_stale_pending) — een betaalde checkout die de betaal-webhook nooit op ACTIVE/PAST_DUE tilde. Een oplopend aantal duidt op een stil kapotte webhook (verkeerde callback-URL, handtekening-mismatch, geblokkeerde poort) → niemand wordt geactiveerd en de platform-omzet lekt stil weg. Controleer de webhook-configuratie bij de betaalprovider (Mollie/Stripe) en /api/billing/webhook."
      - alert: ZzpSubscriptionsPastDueOverdueDowngrade
        # Sluit het laatste gat in de abonnement-stille-faal-familie: ZzpSubscriptionExpiryBacklog dekt
        # ACTIVE-verval, ZzpSubscriptionsStalePending dekt PENDING, deze dekt PAST_DUE. Een mislukte
        # betaling zet de rij op PAST_DUE (webhook); de subscription-past-due-cron herinnert (dag 1/3/7)
        # en downgradet daarna (dag 8+) naar CANCELLED (→ Gratis). De entitlement-guard behandelt PAST_DUE
        # al als Gratis (geen toegangslek), maar een oplopende backlog die de downgrade-drempel
        # (PAST_DUE_DOWNGRADE_AFTER_DAYS, 7 dagen) overschreed terwijl de cron-heartbeat "vers" is betekent
        # dat de hele past-due-pijplijn stilligt: mislukte betalingen blijven eeuwig in PAST_DUE hangen en
        # de herstel-herinneringen gaan niet uit. De ruime `for:` (> één cron-interval) zorgt dat alleen een
        # AANHOUDENDE achterstand paget, niet één rij die net de drempel passeerde. Met de mock-provider
        # (pilot-default) bestaat er nooit een PAST_DUE-rij en vuurt deze alert nooit.
        expr: zzp_subscriptions_past_due_overdue_downgrade > 0
        for: 30h
        labels:
          severity: warning
        annotations:
          summary: "PAST_DUE-abonnement-downgrade verwerkt niets"
          description: "Er staan al > één cron-interval PAST_DUE-abonnementen voorbij de downgrade-drempel (PAST_DUE_DOWNGRADE_AFTER_DAYS) die niet naar CANCELLED (→ Gratis) zijn gezet (zzp_subscriptions_past_due_overdue_downgrade). De subscription-past-due-cron rondt af maar downgradet geen abonnementen → mislukte betalingen blijven eeuwig in PAST_DUE hangen en de herstel-herinneringen (dag 1/3/7) gaan niet uit. Controleer de subscription-past-due-runner in /api/tasks/run-all."
      - alert: ZzpInvoiceOverdueBacklog
        expr: zzp_invoices_overdue_unflipped > 0
        for: 30h
        labels:
          severity: warning
        annotations:
          summary: "Betaal-verval-pijplijn verwerkt niets"
          description: "Er staan al > één cron-interval cascade-facturen met status APPROVED en een verstreken vervaldatum die niet naar OVERDUE zijn gezet (zzp_invoices_overdue_unflipped). De payment-reminders-cron rondt af maar markeert geen facturen te laat → geen aanmaningsladder, geen te-laat-signaal richting de opdrachtgever, en de ZZP'er wordt trager betaald."
      - alert: ZzpReviewsOverdueReveal
        # Vertrouwens-differentiatie (het beoordelingssysteem): de reviews-reveal-cron publiceert
        # double-blind beoordelingen zodra hun venster sluit (revealDeadline ≤ nu). De cron-heartbeat
        # bewijst alleen DÁT de run afrondde, niet DÁT 'ie de reveal-pijplijn verwerkte. Een oplopende
        # backlog terwijl de heartbeat "vers" is betekent dat afgeronde beoordelingen ná venstersluiting
        # verborgen blijven — de beoordeelde ziet zijn ontvangen beoordeling niet, de auteur weet niet dat
        # de zijne zichtbaar had moeten worden. Een klein, tijdelijk aantal is normaal (een venster dat
        # kort ná de 05:00-run sluit blijft tot de volgende dagelijkse run "overdue"); daarom een ruime
        # `for:` (> één cron-interval + speling) zodat alleen een AANHOUDENDE backlog paget.
        expr: zzp_reviews_overdue_reveal > 0
        for: 30h
        labels:
          severity: warning
        annotations:
          summary: "Beoordelings-reveal-pijplijn verwerkt niets"
          description: "Er staan al > één cron-interval beoordelingen met een verstreken double-blind reveal-venster (PENDING_REVEAL, revealDeadline in het verleden) die niet zijn gepubliceerd (zzp_reviews_overdue_reveal). De reviews-reveal-cron rondt af maar onthult geen beoordelingen → afgeronde beoordelingen blijven na venstersluiting verborgen (SLA-breach op het beoordelingssysteem). Controleer de reviews-reveal-taak."
      - alert: ZzpPerformancesOverdueGrace
        # Uitbetaal-kritische statustransitie: de performance-grace-cron keurt een ingediende prestatie
        # (SUBMITTED) na het grace-venster (PERFORMANCE_GRACE_DAYS) automatisch goed, wat de factuur-cascade
        # start. De cron-heartbeat bewijst alleen DÁT de run afrondde, niet DÁT 'ie de grace-pijplijn
        # verwerkte. Een oplopende backlog terwijl de heartbeat "vers" is betekent dat prestaties na hun
        # grace-deadline in SUBMITTED blijven hangen → er wordt geen factuur aangemaakt en de ZZP'er wordt
        # niet uitbetaald. Een klein, tijdelijk aantal is normaal (een prestatie die net de deadline passeert
        # blijft tot de volgende dagelijkse run "overdue"); daarom een ruime `for:` (> één cron-interval +
        # speling) zodat alleen een AANHOUDENDE backlog paget. Staat het grace-venster uit
        # (PERFORMANCE_GRACE_DAYS leeg/0), dan is de gauge per definitie 0 en vuurt deze alert nooit.
        expr: zzp_performances_overdue_grace > 0
        for: 30h
        labels:
          severity: warning
        annotations:
          summary: "Prestatie-grace-pijplijn verwerkt niets"
          description: "Er staan al > één cron-interval ingediende prestaties (SUBMITTED) wier grace-venster verstreken is die niet automatisch zijn goedgekeurd (zzp_performances_overdue_grace). De performance-grace-cron rondt af maar keurt geen prestaties goed → er wordt geen factuur aangemaakt en de ZZP'er wordt niet uitbetaald. Controleer de performance-grace-taak."
      - alert: ZzpDisputesOverdueEscalation
        # Cascade-freeze-detector: een open dispuut bevriest de facturatie-cascade (geen factuur, geen
        # betaling, geen afronding). planDisputeReminders escaleert naar de admins wanneer d > 7
        # (DISPUTE_ESCALATE_AFTER_DAYS), maar de cron-heartbeat bewijst alleen DÁT de run afrondde, niet
        # DÁT 'ie de escalatie-pijplijn verwerkte. Een oplopende backlog terwijl de heartbeat "vers" is
        # betekent dat open disputen boven de drempel eeuwig zonder escalatie blijven → admins worden
        # nooit gepaget om te bemiddelen, de cascade blijft bevroren, en de ZZP'er wacht op geld. Een
        # klein, tijdelijk aantal (tot één cron-interval nadat een dispuut d=8 passeert) is normaal;
        # daarom een ruime `for:` (> één cron-interval + speling) zodat alleen een AANHOUDENDE backlog
        # paget.
        expr: zzp_disputes_overdue_escalation > 0
        for: 30h
        labels:
          severity: warning
        annotations:
          summary: "Dispute-escalatie-pijplijn verwerkt niets"
          description: "Er staan al > één cron-interval open disputen voorbij de escalatie-drempel (DISPUTE_ESCALATE_AFTER_DAYS, 7 dagen) die niet naar admins geëscaleerd zijn (zzp_disputes_overdue_escalation). De dispute-reminders-cron rondt af maar escaleert geen disputen → cascade blijft bevroren (geen factuur/betaling/afronding), admins worden nooit gepaget om te bemiddelen, en de ZZP'er wacht op geld. Controleer de dispute-reminders-runner in /api/tasks/run-all."
      - alert: ZzpMembershipUnbilledActive
        # Omzet-kritische registratie: de zzp-membership-cron legt per maand een maandbijdrage vast voor
        # elke ZZP'er die die maand werk had (de kern-ZZP-monetisatie, PIDZ-model). De cron-heartbeat
        # bewijst alleen DÁT de run afrondde, niet DÁT 'ie de bijdrage-registratie verwerkte. Een oplopende
        # backlog terwijl de heartbeat "vers" is betekent dat actieve ZZP'ers deze maand ongefactureerd
        # blijven → de platform-omzet lekt stil weg (geen bijdrage vastgelegd, dus later niets geïncasseerd).
        # Een klein, tijdelijk aantal is normaal (een ZZP'er die vandaag actief wordt is "unbilled" tot de
        # volgende dagelijkse run); daarom een ruime `for:` (> één cron-interval + speling) zodat alleen een
        # AANHOUDENDE backlog paget. Staat het lidmaatschap uit (ZZP_MEMBERSHIP.enabled = false), dan is de
        # gauge per definitie 0 en vuurt deze alert nooit.
        expr: zzp_membership_unbilled_active > 0
        for: 30h
        labels:
          severity: warning
        annotations:
          summary: "ZZP-lidmaatschap-registratie verwerkt niets"
          description: "Er zijn al > één cron-interval actieve ZZP'ers in de lopende maand zonder een geregistreerde maandbijdrage (zzp_membership_unbilled_active). De zzp-membership-cron rondt af maar legt geen bijdragen vast → actieve ZZP'ers blijven ongefactureerd en de platform-omzet lekt stil weg. Controleer de zzp-membership-taak."

      - alert: ZzpAuditRetentionBacklog
        # AVG-dataminimalisatie (art. 5 lid 1e): auditregels dragen IP + user-agent. Een oplopende
        # backlog terwijl de heartbeat "vers" is betekent dat persoonsgegevens over de wettelijke termijn
        # heen bewaard blijven. Alleen actief zodra AUDIT_LOG_RETENTION_DAYS gezet is (anders altijd 0).
        expr: zzp_audit_retention_backlog > 0
        for: 30h
        labels:
          severity: warning
        annotations:
          summary: "Audit-retentie-snoei verwerkt niets (AVG-dataminimalisatie)"
          description: "Er staan al > één cron-interval auditregels ouder dan het geconfigureerde AUDIT_LOG_RETENTION_DAYS-venster die niet zijn gesnoeid (zzp_audit_retention_backlog). De audit-retention-cron rondt af maar verwijdert niets → auditregels met IP + user-agent worden over de wettelijke bewaartermijn heen bewaard (AVG art. 5(1)(e)). Controleer de audit-retention-taak."

      - alert: ZzpApplicationsRetentionBacklog
        # AVG-dataminimalisatie (art. 5 lid 1e): terminale reacties dragen vrije-tekst-PII in
        # motivation/note; het verwerkingsregister belooft die "tot 4 weken na afronding van de
        # selectieprocedure". Een oplopende backlog terwijl de heartbeat "vers" is betekent dat reactie-PII
        # over de beloofde termijn heen bewaard blijft. Alleen actief zodra APPLICATION_RETENTION_DAYS gezet
        # is (anders altijd 0).
        expr: zzp_applications_retention_backlog > 0
        for: 30h
        labels:
          severity: warning
        annotations:
          summary: "Reactie-retentie-snoei verwerkt niets (AVG-dataminimalisatie)"
          description: "Er staan al > één cron-interval terminale reacties (REJECTED/WITHDRAWN) ouder dan het geconfigureerde APPLICATION_RETENTION_DAYS-venster die niet zijn gesnoeid (zzp_applications_retention_backlog). De application-retention-cron rondt af maar verwijdert niets → reacties met vrije-tekst-PII (motivation/note) worden over de beloofde bewaartermijn heen bewaard (AVG art. 5(1)(e)). Controleer de application-retention-taak."

      - alert: ZzpNotificationsRetentionBacklog
        # AVG-dataminimalisatie (art. 5 lid 1e): notificaties dragen PII in title/body (namen, bedragen,
        # statusupdates); het verwerkingsregister belooft "Notificatiehistorie max. 6 maanden". Een oplopende
        # backlog terwijl de heartbeat "vers" is betekent dat notificatie-PII over de beloofde termijn heen
        # bewaard blijft. Alleen actief zodra NOTIFICATION_RETENTION_DAYS gezet is (anders altijd 0).
        expr: zzp_notifications_retention_backlog > 0
        for: 30h
        labels:
          severity: warning
        annotations:
          summary: "Notificatie-retentie-snoei verwerkt niets (AVG-dataminimalisatie)"
          description: "Er staan al > één cron-interval notificaties ouder dan het geconfigureerde NOTIFICATION_RETENTION_DAYS-venster die niet zijn gesnoeid (zzp_notifications_retention_backlog). De notification-retention-cron rondt af maar verwijdert niets → notificaties met PII in title/body worden over de beloofde bewaartermijn heen bewaard (AVG art. 5(1)(e)). Controleer de notification-retention-taak."

      - alert: ZzpLeadsRetentionBacklog
        # AVG-dataminimalisatie (art. 5 lid 1e): beslíste leads dragen contact-PII (cascade-gekoppeld
        # LeadContact-logboek); het verwerkingsregister belooft "tot de lead klant wordt of afvalt + 12
        # maanden". Een oplopende backlog terwijl de heartbeat "vers" is betekent dat lead-PII over de beloofde
        # termijn heen bewaard blijft. Alleen actief zodra LEAD_RETENTION_DAYS gezet is (anders altijd 0).
        expr: zzp_leads_retention_backlog > 0
        for: 30h
        labels:
          severity: warning
        annotations:
          summary: "Lead-retentie-snoei verwerkt niets (AVG-dataminimalisatie)"
          description: "Er staan al > één cron-interval beslíste leads (KLANT/NO_DEAL) ouder dan het geconfigureerde LEAD_RETENTION_DAYS-venster die niet zijn gesnoeid (zzp_leads_retention_backlog). De lead-retention-cron rondt af maar verwijdert niets → leads met contact-PII (naam/e-mail/telefoon + contactlogboek) worden over de beloofde bewaartermijn heen bewaard (AVG art. 5(1)(e)). Controleer de lead-retention-taak."

      - alert: ZzpHealthIncidentsIpRetentionBacklog
        # AVG-minimalisatie + opslagbeperking (art. 5 lid 1c/1e): een beveiligingsincident (HealthIncident)
        # legt bij een inlog-burst/reset-flood het bron-IP (een persoonsgegeven) vast in evidence én summary.
        # Anders dan de andere retentie-crons staat deze standaard AAN (venster leeg → default 90 dagen), want
        # onbeperkte IP-retentie is hier de overtreding. Een oplopende backlog terwijl de heartbeat "vers" is
        # betekent dat incident-IP's over de bewaartermijn heen bewaard blijven zonder dat iets dat toont.
        expr: zzp_health_incidents_ip_retention_backlog > 0
        for: 30h
        labels:
          severity: warning
        annotations:
          summary: "Incident-IP-redactie verwerkt niets (AVG-minimalisatie)"
          description: "Er staan al > één cron-interval beveiligingsincidenten ouder dan het geconfigureerde HEALTH_INCIDENT_IP_RETENTION_DAYS-venster wier bron-IP niet is geredigeerd (zzp_health_incidents_ip_retention_backlog). De health-incident-retention-cron rondt af maar redigeert niets → incident-IP's (persoonsgegeven, in evidence + summary + dedupeKey) worden over de bewaartermijn heen bewaard (AVG art. 5(1)(c)/(e)). Controleer de health-incident-retention-taak."

      - alert: ZzpMessagesRetentionBacklog
        # AVG-dataminimalisatie (art. 5 lid 1e): berichten dragen de daadwerkelijke chatinhoud tussen
        # ZZP'er en opdrachtgever (Message.body) — het meest PII-dragende vrije-tekstveld; het
        # verwerkingsregister belooft "duur van de samenwerking + max. 12 maanden na beëindiging". Een
        # oplopende backlog terwijl de heartbeat "vers" is betekent dat berichtinhoud over de beloofde
        # termijn heen bewaard blijft. Alleen actief zodra MESSAGE_RETENTION_DAYS gezet is (anders altijd 0).
        expr: zzp_messages_retention_backlog > 0
        for: 30h
        labels:
          severity: warning
        annotations:
          summary: "Berichten-retentie-snoei verwerkt niets (AVG-dataminimalisatie)"
          description: "Er staan al > één cron-interval berichten ouder dan het geconfigureerde MESSAGE_RETENTION_DAYS-venster (niet gekoppeld aan een lopende samenwerking) die niet zijn gesnoeid (zzp_messages_retention_backlog). De message-retention-cron rondt af maar verwijdert niets → berichtinhoud (Message.body) wordt over de beloofde bewaartermijn heen bewaard (AVG art. 5(1)(e)). Controleer de message-retention-taak."

      - alert: ZzpWebhookEventsRetentionBacklog
        # GEEN AVG-kwestie (de webhook-ledgerrijen dragen geen PII — alleen een opaque providerreferentie +
        # status) maar opslag-hygiëne/availability: de ProcessedWebhookEvent-ledger groeit monotoon met elk
        # betaal-webhook-event. Een oplopende backlog terwijl de heartbeat "vers" is betekent dat de ledger
        # onbeperkt doorgroeit ondanks het gezette venster (schijf-/querylast). Alleen actief zodra
        # WEBHOOK_EVENT_RETENTION_DAYS gezet is (anders altijd 0).
        expr: zzp_webhook_events_retention_backlog > 0
        for: 30h
        labels:
          severity: warning
        annotations:
          summary: "Webhook-event-ledger-snoei verwerkt niets (opslag-hygiëne)"
          description: "Er staan al > één cron-interval webhook-ledgerrijen (ProcessedWebhookEvent) ouder dan het geconfigureerde WEBHOOK_EVENT_RETENTION_DAYS-venster die niet zijn gesnoeid (zzp_webhook_events_retention_backlog). De webhook-event-retention-cron rondt af maar verwijdert niets → de idempotentie-ledger groeit onbeperkt door ondanks het gezette venster (schijf-/index-/querylast; geen PII). Controleer de webhook-event-retention-taak."

      - alert: ZzpRoutingCacheRetentionBacklog
        # AVG-dataminimalisatie (art. 5 lid 1e): de routing-cachetabellen (GeocodeCache + TravelRouteCache)
        # bewaren platte-tekst locatiegegevens (query/fromQuery/toQuery — herleidbare adres-/plaatsindicaties
        # van ZZP'ers en opdrachten). De leeslaag negeert verlopen rijen alleen lazy; alleen deze cron
        # verwijdert ze fysiek. Een oplopende backlog terwijl de heartbeat "vers" is betekent dat locatie-PII
        # over de eigen TTL heen bewaard blijft. Anders dan de config-gevensterde retenties is deze ALTIJD
        # actief (de TTL zit per rij ingebakken — geen instelvenster, dus nooit 0-per-definitie).
        expr: zzp_routing_cache_retention_backlog > 0
        for: 30h
        labels:
          severity: warning
        annotations:
          summary: "Routing-cache-retentie-snoei verwerkt niets (AVG-dataminimalisatie)"
          description: "Er staan al > één cron-interval routing-cacherijen (GeocodeCache + TravelRouteCache) wier eigen TTL is verstreken die niet fysiek zijn verwijderd (zzp_routing_cache_retention_backlog). De routing-cache-retention-cron rondt af maar verwijdert niets → platte-tekst locatie-PII (query/fromQuery/toQuery) wordt over de eigen bewaartermijn heen bewaard (AVG art. 5(1)(e)). Controleer de routing-cache-retention-taak."

  - name: zzp-platform-verificatie-sla
    rules:
      # Verificatie is de kern-differentiatie. Twee complementaire signalen: te veel wachtenden (diepte)
      # en te lang wachten (leeftijd). De leeftijd vangt een kleine-maar-vastgelopen wachtrij die de
      # kale diepte mist. Sentinel -1 (lege wachtrij) valt vanzelf buiten `> ...`.
      - alert: ZzpVerificationQueueDeep
        expr: zzp_verification_queue > 50
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "Verificatie-wachtrij loopt op"
          description: "De admin-verificatiewachtrij bevat aanhoudend > 50 openstaande inzendingen (zzp_verification_queue). Schaal de beoordelingscapaciteit op."
      - alert: ZzpVerificationOldestTooOld
        # 24 uur = 86400 s. Een inzending die langer dan een werkdag wacht is een SLA-breach op de
        # kern-differentiatie, ook als de wachtrij verder kort is.
        expr: zzp_verification_queue_oldest_age_seconds > 86400
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Oudste verificatie wacht te lang"
          description: "De langst wachtende verificatie-inzending wacht > 24 uur (zzp_verification_queue_oldest_age_seconds). Handel de wachtrij op /admin/verificaties af."

  - name: zzp-platform-onderhoud
    rules:
      - alert: ZzpMaintenanceModeOn
        # Info/inhibitor: geen incident, maar maakt een per ongeluk aan-gelaten onderhoudsmodus zichtbaar.
        # Gebruik deze gauge ook als inhibit_rule-bron om de beschikbaarheidsalerts te onderdrukken tijdens
        # bewust onderhoud.
        expr: zzp_maintenance_mode == 1
        for: 2h
        labels:
          severity: info
        annotations:
          summary: "Onderhoudsmodus staat aan"
          description: "MAINTENANCE_MODE staat al > 2 uur aan (zzp_maintenance_mode=1); bezoekers krijgen een 503. Bevestig dat dit bewust is en zet 'm daarna weer uit."
