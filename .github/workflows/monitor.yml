name: Platform-bewaking

# Geplande beveiligings-/gezondheidsbewaking (code-kant). Roept het beveiligde endpoint
# POST /api/tasks/monitor aan, dat de recente audit-log scant op auth-anomalieën
# (brute-force-bursts, reset-floods, rolwijziging-bursts) en incidenten wegschrijft +
# admins waarschuwt. De runner is idempotent (dedupeKey per tijdvenster).
#
# Mensenwerk (eenmalig, anders draait dit niet):
#   - Repo-secret MONITOR_TASK_URL = https://<productie-host>/api/tasks/monitor
#   - Repo-secret CRON_SECRET      = dezelfde waarde als de CRON_SECRET van de server
# Zonder deze secrets stopt de job vroegtijdig zonder te falen.

on:
  schedule:
    - cron: "*/10 * * * *" # elke 10 minuten
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Endpoint aanroepen
        env:
          MONITOR_TASK_URL: ${{ secrets.MONITOR_TASK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$MONITOR_TASK_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "MONITOR_TASK_URL of CRON_SECRET ontbreekt — taak overgeslagen (configureer de repo-secrets)."
            exit 0
          fi
          status=$(curl -sS -o /tmp/monitor-response.json -w "%{http_code}" \
            -X POST "$MONITOR_TASK_URL" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "HTTP $status"
          cat /tmp/monitor-response.json || true
          echo
          if [ "$status" != "200" ]; then
            echo "Platform-bewaking faalde (HTTP $status)."
            exit 1
          fi

  deploy-lag-watchdog:
    # Incident 2-9-2026: elke deploy sinds 12-8 faalde stil (preflight NO-GO ná commit 66dba72),
    # terwijl /api/health braaf "status: ok" bleef melden op de OUDE build — niemand merkte het
    # drie weken. Deze job vergelijkt de commit die productie daadwerkelijk draait (/api/health,
    # zie src/lib/observability/health.ts) met de laatste commit op origin/main. Verschillen ze
    # terwijl main 3+ uur oud is, dan opent/actualiseert de job één GitHub-issue (via het label
    # `deploy-lag`) zodat een stille deploy-storing nooit meer weken onopgemerkt blijft.
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-lag-watchdog
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Productie-commit vs. main vergelijken
        id: check
        env:
          # Geen bestaand secret/var voor de health-URL in deze repo (gecontroleerd 2-9-2026) —
          # hardcoded met een override-mogelijkheid via een repo-variabele, zodat een toekomstige
          # domeinwissel geen workflow-wijziging vereist (Settings → Secrets and variables →
          # Actions → Variables → PRODUCTION_HEALTH_URL).
          HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL || 'https://zzp-platform-production-ba07.up.railway.app/api/health' }}
        run: node scripts/deploy-lag-watchdog.mjs check

      - name: Issue openen/bijwerken of sluiten
        if: steps.check.outputs.lag == 'true' || steps.check.outputs.lag == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          LAG: ${{ steps.check.outputs.lag }}
          MAIN_SHA: ${{ steps.check.outputs.main_sha }}
          PROD_SHA: ${{ steps.check.outputs.prod_sha }}
          AGE_HOURS: ${{ steps.check.outputs.age_hours }}
          REPO: ${{ github.repository }}
        run: node scripts/deploy-lag-watchdog.mjs incident
