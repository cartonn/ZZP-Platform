name: Auto-build (scheduled)

# 24/7 doorbouwen zonder open sessie.
# Elke 15 min pakt één agent het bovenste backlog-item op, bouwt op een feature branch,
# en opent een PR naar main. De eigenaar reviewt en merget.
# Draait op Claude Max (OAuth) — geen API-kosten per token.
# Na de bouwronde draait e2e (Playwright + Chromium) als visuele regressiecheck.
#
# Vereist repo-secret: CLAUDE_OAUTH_TOKEN
# STOPPEN: zet de workflow uit in het Actions-tabblad.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: auto-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: "file:./ci.db"
      AUTH_SECRET: "ci-dummy-secret-minstens-16-tekens-lang"
      STORAGE_DRIVER: "local"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci || npm install

      - name: Maak feature branch
        run: |
          BRANCH="auto-build/run-${{ github.run_id }}"
          git config user.name "zzp-autobuild"
          git config user.email "autobuild@users.noreply.github.com"
          git checkout -b "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Autonome bouwronde
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Autonome bouwmodus voor de ZZP Platform-overhaul.
            Je werkt op een feature branch — commit en push hier, NIET naar main.
            1. Lees CLAUDE.md, CURRENT_TASK.md, PROGRESS.md en prompts/PLATFORM_OVERHAUL.md.
            2. Pak de volgende afgebakende overhaul-increment (Fase 5/6/7: o.a. PDF/print-factuur,
               e-mailkanaal-abstractie, extra exports, edge cases/hardening). VERMIJD een dark-first
               re-theme (open beslissing van de eigenaar). Geen geld via het platform; DBA blijft
               signaleren met disclaimer.
            3. Definition of Done: testbare kern + unit-tests, dan npm run typecheck, npm run lint,
               npm run test en npm run build — allemaal groen.
            4. Draai `npx prettier --write .` voor je commit.
            5. Commit met duidelijke message. Push naar de huidige branch.
            6. Werk PROGRESS.md en CURRENT_TASK.md bij; commit en push opnieuw.
            Vraag niet om goedkeuring. Geen "AI" in UI/teksten/commits. Stop alleen bij een echte blocker.
          claude_args: |
            --model claude-sonnet-4-6
            --allowedTools Edit,Read,Write,Bash
            --max-turns 60

      - name: Formattering normaliseren
        run: |
          npx prettier --write . 2>/dev/null || true
          if ! git diff --quiet; then
            git add -A
            git commit -m "style: format with Prettier"
          fi

      - name: Push branch + open PR
        run: |
          git push -u origin "$BRANCH" || exit 0
          gh pr create --base main --head "$BRANCH" \
            --title "auto-build: $(git log -1 --format=%s)" \
            --body "$(cat <<'BODY'
          ## Auto-build ronde

          Automatisch gebouwd door de 24/7 auto-build agent.
          Review de wijzigingen en merge als alles groen is.

          **Checklist (automatisch):**
          - [x] `npm run check` gedraaid door agent
          - [x] Prettier formatting toegepast
          - [ ] E2e check (draait hieronder)
          BODY
          )" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: "file:./ci.db"
      AUTH_SECRET: "ci-dummy-secret-minstens-16-tekens-lang"
      STORAGE_DRIVER: "local"
      # De e2e-server draait in productiemodus (`next start`); de env-validatie dwingt dan
      # SHARE_TOKEN_SECRET + AUTH_URL af. Dummy-waarden (zoals AUTH_SECRET hierboven) volstaan.
      SHARE_TOKEN_SECRET: "ci-dummy-share-token-secret-minstens-16"
      AUTH_URL: "http://localhost:3000"
      CI: "true"
      # Eén IP + gedeelde seed-accounts voor de héle suite; verhoog de strenge
      # productie-rate-limits zodat login/registratie niet onterecht wordt geblokkeerd.
      LOGIN_RATE_LIMIT: "100000"
      REAUTH_RATE_LIMIT: "100000"
      REGISTER_RATE_LIMIT: "100000"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate
      - run: npx prisma db seed
      - run: npx playwright install chromium --with-deps
      - run: npm run build
      - run: npx playwright test --project=ci

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/screenshots/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
