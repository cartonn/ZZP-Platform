name: Auto-build (scheduled)

# 24/7 doorbouwen zonder open sessie.
# Elke 15 min pakt één agent het bovenste backlog-item op, levert af en pusht.
# Draait op Claude Max (OAuth) — geen API-kosten per token.
#
# Vereist repo-secret: CLAUDE_OAUTH_TOKEN (van claude.ai/settings/api)
# Optioneel: BUILD_PAT (fine-grained PAT met contents:write + actions:write)
#   — met BUILD_PAT triggert de agent na afloop meteen een nieuwe ronde via
#     workflow_dispatch (sneller dan wachten op het 15-min schedule).
# STOPPEN: zet de workflow uit in het Actions-tabblad.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-build
  cancel-in-progress: false

env:
  WORK_BRANCH: claude/modest-babbage-08jYa

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: "file:./ci.db"
      AUTH_SECRET: "ci-dummy-secret-minstens-16-tekens-lang"
      STORAGE_DRIVER: "local"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WORK_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.BUILD_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci || npm install

      - name: Autonome bouwronde
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
          github_token: ${{ secrets.BUILD_PAT || secrets.GITHUB_TOKEN }}
          prompt: |
            Autonome bouwmodus voor de ZZP Platform-overhaul. Werk op branch ${{ env.WORK_BRANCH }}.
            1. Lees CLAUDE.md, CURRENT_TASK.md, PROGRESS.md en prompts/PLATFORM_OVERHAUL.md.
            2. git fetch origin && git rebase origin/${{ env.WORK_BRANCH }}.
            3. Pak de volgende afgebakende overhaul-increment (Fase 5/6/7: o.a. PDF/print-factuur,
               e-mailkanaal-abstractie, extra exports, edge cases/hardening). VERMIJD een dark-first
               re-theme (open beslissing van de eigenaar). Geen geld via het platform; DBA blijft
               signaleren met disclaimer.
            4. Definition of Done: testbare kern + unit-tests, dan npm run typecheck, npm run lint,
               npm run test en npm run build — allemaal groen. E2e overslaan (geen browser-channel).
            5. Commit met duidelijke message en push naar ${{ env.WORK_BRANCH }}. Geen PR.
            6. Werk PROGRESS.md en CURRENT_TASK.md bij; commit en push opnieuw.
            Vraag niet om goedkeuring. Geen "AI" in UI/teksten/commits. Stop alleen bij een echte blocker.
          claude_args: |
            --model claude-sonnet-4-6
            --allowedTools Edit,Read,Write,Bash
            --max-turns 60

      - name: Re-arm (trigger volgende ronde direct)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.BUILD_PAT || secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GH_TOKEN" = "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "Geen BUILD_PAT — volgende ronde via schedule (max 15 min)"
            exit 0
          fi
          echo "BUILD_PAT aanwezig — trigger volgende ronde via workflow_dispatch"
          sleep 60
          gh workflow run auto-build.yml --ref "${WORK_BRANCH}"
