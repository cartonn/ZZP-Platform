name: Dependency review

# Supply-chain-poort: blokkeert een PR die een kwetsbare of niet-toegestane dependency toevoegt
# (bekende CVE's, gevaarlijke licenties). Cross-check op de package-laag, naast `npm audit` in
# security.yml. Draait alleen op pull_request (vergelijkt base vs head).

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
