name: Security

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # wekelijks, maandagochtend

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Hard-gate op de PRODUCTIE-dependencies: alleen wat daadwerkelijk meedraait mag een deploy
      # blokkeren. Dev-tooling (vitest/vite/esbuild) draait nooit in productie; advisories daarin
      # (bv. de Vitest-UI-fileread) horen de build niet rood te maken.
      - name: npm audit productie-deps (faalt op high/critical)
        run: npm audit --audit-level=high --omit=dev
      # Volledige audit (incl. dev) puur ter info — blokkeert niet.
      - name: npm audit volledig (informatief)
        run: npm audit --audit-level=high || true

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run scan:secrets
      - run: npm run check:env
