name: Security

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # wekelijks, maandagochtend

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Hard-gate op de PRODUCTIE-dependencies: alleen wat daadwerkelijk meedraait mag een deploy
      # blokkeren. Dev-tooling (vitest/vite/esbuild) draait nooit in productie; advisories daarin
      # (bv. de Vitest-UI-fileread) horen de build niet rood te maken.
      #
      # `npm audit` geeft exit != 0 bij (a) een high/critical-bevinding ÓF (b) een onbereikbaar
      # audit-endpoint (bv. registry HTTP 503 "Service Unavailable") — in de exitcode niet te
      # onderscheiden. Deze wrapper leest de --json-uitvoer en onderscheidt ze wél: een echt rapport
      # met een high/critical-bevinding blokkeert (exit 1, gate volledig intact), een bevestigde
      # registry-storing wordt niet-blokkerend behandeld met een waarschuwing (backstop: de
      # informatieve volledige-audit hieronder + de wekelijkse scheduled run). Onverwachte uitvoer
      # faalt fail-safe. Zie scripts/audit-production.mjs (+ .test.ts) voor de exacte regels.
      - name: npm audit productie-deps (faalt op high/critical; tolerant voor registry-storing)
        run: node scripts/audit-production.mjs
      # Volledige audit (incl. dev) puur ter info — blokkeert niet.
      - name: npm audit volledig (informatief)
        run: npm audit --audit-level=high || true

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run scan:secrets
      - run: npm run check:env
