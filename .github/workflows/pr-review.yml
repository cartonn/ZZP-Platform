name: offline-diagnostic

# Diagnostic branch only. This never reviews a PR or publishes a required check.
# --help exits during native argument parsing; the dummy key cannot fund a call.
# A successful short probe does not prove long-running review/runner stability.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-diagnostic:
    name: offline-diagnostic (${{ matrix.safety }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        safety: [drop-sudo, unprivileged-user]
    env:
      DIAGNOSTIC_SAFETY: ${{ matrix.safety }}
      DIAGNOSTIC_USER: ${{ matrix.safety == 'unprivileged-user' && 'codex-diagnostic' || 'runner' }}
    steps:
      - name: Checkout the diagnostic controls
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: diagnostic-control
          persist-credentials: false

      - name: Checkout the exact official action
        uses: actions/checkout@v4
        with:
          repository: openai/codex-action
          ref: 86365089eb2b84e0a8fb0717b304f8bdcb13b20e
          path: review-action
          persist-credentials: false

      - name: Apply the already controlled lifecycle patch
        run: node diagnostic-control/scripts/patch-codex-action.mjs review-action

      - name: Prepare the account, harmless output sentinel and baseline
        shell: bash
        run: |
          set -euo pipefail
          DIAGNOSTIC_WORK="$RUNNER_TEMP/offline-codex-work"
          DIAGNOSTIC_OUTPUT="$RUNNER_TEMP/offline-codex-output/result.txt"
          if [ "$DIAGNOSTIC_SAFETY" = unprivileged-user ]; then
            sudo useradd --system --create-home --user-group --shell /usr/sbin/nologin codex-diagnostic
            expected_group="$(id -g codex-diagnostic)"
            test "$(id -G codex-diagnostic)" = "$expected_group"
            if sudo -u codex-diagnostic -- sudo -n true 2>/dev/null; then
              echo '::error::The diagnostic account unexpectedly has sudo access.'
              exit 1
            fi
            # Traverse only: no runner group membership or broad home/source access.
            sudo setfacl -m u:codex-diagnostic:--x /home/runner /home/runner/work "$RUNNER_WORKSPACE" "$RUNNER_TEMP"
            sudo setfacl -m u:runner:--x /home/codex-diagnostic
            sudo -u codex-diagnostic -- node --version
          fi
          diagnostic_group="$(id -gn "$DIAGNOSTIC_USER")"
          sudo install -d -m 0755 -o "$DIAGNOSTIC_USER" -g "$diagnostic_group" "$DIAGNOSTIC_WORK" "$(dirname "$DIAGNOSTIC_OUTPUT")"
          # Help creates no model result. This explicit non-review marker exercises
          # the official final read/cat/setOutput path after native exit code zero.
          printf '%s' OFFLINE_HELP_ONLY_NO_REVIEW > "$RUNNER_TEMP/offline-sentinel.txt"
          sudo install -m 0644 -o "$DIAGNOSTIC_USER" -g "$diagnostic_group" "$RUNNER_TEMP/offline-sentinel.txt" "$DIAGNOSTIC_OUTPUT"
          {
            date --utc --iso-8601=seconds
            printf 'phase=before safety=%s\n' "$DIAGNOSTIC_SAFETY"
            id
            id "$DIAGNOSTIC_USER"
            stat -Lc '%n mode=%a owner=%U:%G' /run/dbus/system_bus_socket /run/systemd/journal/stdout /run/docker.sock || true
            timeout 5 getent hosts api.github.com || true
          } | tee "$RUNNER_TEMP/offline-before.txt"

      - name: Native help through the real official privilege path
        id: native_help
        continue-on-error: true
        uses: ./review-action
        with:
          openai-api-key: offline-diagnostic-dummy-not-a-real-key
          codex-version: "0.154.0"
          working-directory: ${{ runner.temp }}/offline-codex-work
          output-file: ${{ runner.temp }}/offline-codex-output/result.txt
          permission-profile: ":read-only"
          safety-strategy: ${{ matrix.safety }}
          codex-user: ${{ matrix.safety == 'unprivileged-user' && 'codex-diagnostic' || '' }}
          # Leave codex-home unset: sudo -u does not preserve an arbitrary CODEX_HOME.
          prompt: "Offline help probe only. No model request, repository review or tools."
          codex-args: '["--help"]'

      - name: Record native exit, runner transport and DNS after the action
        if: always()
        shell: bash
        env:
          NATIVE_HELP_OUTCOME: ${{ steps.native_help.outcome }}
          NATIVE_HELP_RESULT: ${{ steps.native_help.outputs.final-message }}
          DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/offline-codex-output/result.txt
        run: |
          set +e
          {
            date --utc --iso-8601=seconds
            printf 'phase=after safety=%s action_outcome=%s\n' "$DIAGNOSTIC_SAFETY" "$NATIVE_HELP_OUTCOME"
            printf 'POST_ACTION_REACHED\n'
            node --version
            codex --version
            id
            id "$DIAGNOSTIC_USER"
            stat -Lc '%n mode=%a owner=%U:%G' /run/dbus/system_bus_socket /run/systemd/journal/stdout /run/docker.sock
            ps -eo pid,ppid,uid,gid,stat,wchan:24,comm | rg 'PID|codex|node|sudo|Runner|systemd-resolv|dbus|MainThread'
            timeout 5 getent hosts api.github.com
            printf 'DNS_EXIT=%s\n' "$?"
            curl --head --silent --show-error --connect-timeout 3 --max-time 8 https://api.github.com
            printf 'HTTPS_EXIT=%s\n' "$?"
            cmp "$RUNNER_TEMP/offline-sentinel.txt" "$DIAGNOSTIC_OUTPUT"
            printf 'SENTINEL_UNCHANGED_EXIT=%s\n' "$?"
          } 2>&1 | tee "$RUNNER_TEMP/offline-after.txt"
          if [ "$NATIVE_HELP_OUTCOME" != success ] || [ "$NATIVE_HELP_RESULT" != OFFLINE_HELP_ONLY_NO_REVIEW ]; then
            echo '::error::Offline native-help execution did not complete normally. This is no review result.'
            exit 1
          fi
          printf 'OFFLINE_HELP_EXIT_AND_FINALIZATION_OBSERVED\n'

      - name: Preserve diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-diagnostic-${{ matrix.safety }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/offline-before.txt
            ${{ runner.temp }}/offline-after.txt
            ${{ runner.temp }}/offline-sentinel.txt
            ${{ runner.temp }}/offline-codex-output/result.txt
          if-no-files-found: warn
          retention-days: 7
