name: agent-review

# The required check is explicitly published on the reviewed PR head. Automatic
# job conclusions belong to the trusted control SHA and have different names.
# Bootstrap requires an independently reviewed, locked branch AND an external
# CODEX_REVIEW_BOOTSTRAP_SHA repository variable. Remove that variable after merge.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR-nummer (uitvoeren vanaf beschermde main of vastgezette bootstrap)"
        required: true
        type: string

permissions:
  contents: read

env:
  REVIEW_CONTROL_SHA: ${{ github.workflow_sha }}
  REVIEW_WORKFLOW_REF: ${{ github.workflow_ref }}
  REVIEW_BOOTSTRAP_SHA: ${{ vars.CODEX_REVIEW_BOOTSTRAP_SHA }}
  REVIEW_PR: ${{ github.event.pull_request.number || inputs.pr }}

concurrency:
  group: agent-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  prepare-review:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: write
    outputs:
      head: ${{ steps.prepare.outputs.head }}
      context: ${{ steps.prepare.outputs.context }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: review-control
          persist-credentials: false

      - name: Verify trusted controls, freeze PR context and start its check
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node review-control/scripts/agent-review-codex.mjs prepare

  codex-review:
    needs: prepare-review
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      report: ${{ steps.codex.outputs.final-message }}
      authenticated: ${{ steps.auth.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: review-control
          persist-credentials: false

      - name: Build the prompt exclusively from trusted controls
        env:
          REVIEW_CONTEXT: ${{ needs.prepare-review.outputs.context }}
        run: node review-control/scripts/agent-review-codex.mjs prompt

      - uses: actions/checkout@v4
        with:
          repository: openai/codex-action
          ref: 86365089eb2b84e0a8fb0717b304f8bdcb13b20e
          path: review-action
          persist-credentials: false

      - name: Apply the verified action process-close repair
        run: node review-control/scripts/patch-codex-action.mjs review-action

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-review.outputs.head }}
          path: review-source
          fetch-depth: 0
          persist-credentials: false

      - name: Check review authentication
        id: auth
        env:
          REVIEW_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$REVIEW_API_KEY" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::error::REVIEW INCOMPLETE: OPENAI_API_KEY ontbreekt.'
            exit 1
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      # PR files are review data. Never run their installers, hooks or actions.
      # The model has no repository write token. An output file alone never passes.
      - name: Independent adversarial Codex review
        id: codex
        uses: ./review-action
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          working-directory: ${{ github.workspace }}/review-source
          prompt-file: ${{ runner.temp }}/agent-review-codex-prompt.md
          output-schema-file: ${{ github.workspace }}/review-control/.github/codex/agent-review.schema.json
          output-file: ${{ runner.temp }}/agent-review-codex-final.json
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          model: gpt-5.5
          effort: high
          codex-args: '["--ephemeral"]'

      - name: Preserve raw review output, including unsuccessful runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-review-raw-${{ env.REVIEW_PR }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-review-codex-final.json
          if-no-files-found: ignore
          retention-days: 30

  publish-review:
    needs: [prepare-review, codex-review]
    if: ${{ always() && needs.prepare-review.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: review-control
          persist-credentials: false

      - name: Revalidate current PR and finish the same check with the genuine verdict
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_CONTEXT: ${{ needs.prepare-review.outputs.context }}
          REVIEW_REPORT: ${{ needs.codex-review.outputs.report }}
          REVIEW_RUN_RESULT: ${{ needs.codex-review.result }}
          REVIEW_AUTHENTICATED: ${{ needs.codex-review.outputs.authenticated }}
        run: node review-control/scripts/agent-review-codex.mjs enforce

      - name: Preserve validated review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-review-${{ env.REVIEW_PR }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-review-codex-*.json
          if-no-files-found: ignore
          retention-days: 30
