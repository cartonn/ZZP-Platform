name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Lint + typecheck + unit-tests + build in één run (npm run check).
# E2e (Playwright) draait lokaal via Edge; in CI bewust niet meegenomen i.v.m. browser-channel.
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./ci.db"
      AUTH_SECRET: "ci-dummy-secret-minstens-16-tekens-lang"
      STORAGE_DRIVER: "local"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run check
