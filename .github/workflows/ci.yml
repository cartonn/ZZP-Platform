name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./ci.db"
      AUTH_SECRET: "ci-dummy-secret-minstens-16-tekens-lang"
      STORAGE_DRIVER: "local"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run check
      - run: npx prettier --check .

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      DATABASE_URL: "file:./ci.db"
      AUTH_SECRET: "ci-dummy-secret-minstens-16-tekens-lang"
      STORAGE_DRIVER: "local"
      CI: "true"
      SEED_DEMO: "true"
      # De héle e2e-suite draait vanaf één IP met dezelfde seed-accounts; de strenge
      # productie-defaults (5) zouden de login/registratie onterecht blokkeren.
      LOGIN_RATE_LIMIT: "100000"
      REGISTER_RATE_LIMIT: "100000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate && npx prisma db push --skip-generate && npx prisma db seed
      - run: npx playwright install chromium --with-deps
      - run: npm run build
      - run: npx playwright test e2e/smoke.spec.ts --project=ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            e2e/screenshots/
            playwright-report/
          retention-days: 7
