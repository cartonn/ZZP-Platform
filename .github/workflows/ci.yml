name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./ci.db"
      AUTH_SECRET: "ci-dummy-secret-minstens-16-tekens-lang"
      STORAGE_DRIVER: "local"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run check
      - run: npx prettier --check .

  e2e:
    runs-on: ubuntu-latest
    # Een normale e2e-run duurt ~6 min, maar op een trage runner (npm ci + playwright
    # install --with-deps + next build) kan hij tegen de oude 15-min-limiet aanlopen. Een
    # getimede job krijgt de conclusie "cancelled" — en omdat `e2e` een VERPLICHTE
    # statuscheck is (harde merge-poort) blokkeert dat de PR permanent, ook al slaagde de
    # test op een parallelle push/pull_request-run. Ruimere marge voorkomt dat een
    # incidentele trage runner de merge-poort (en daarmee o.a. security-fixes) laat vastlopen.
    timeout-minutes: 25
    continue-on-error: true
    env:
      DATABASE_URL: "file:./ci.db"
      AUTH_SECRET: "ci-dummy-secret-minstens-16-tekens-lang"
      STORAGE_DRIVER: "local"
      # De e2e-server draait in productiemodus (`next start`); de env-validatie dwingt dan
      # SHARE_TOKEN_SECRET + AUTH_URL af. Dummy-waarden (zoals AUTH_SECRET hierboven) volstaan.
      SHARE_TOKEN_SECRET: "ci-dummy-share-token-secret-minstens-16"
      AUTH_URL: "http://localhost:3000"
      CI: "true"
      SEED_DEMO: "true"
      # De héle e2e-suite draait vanaf één IP met dezelfde seed-accounts; de strenge
      # productie-defaults (5) zouden de login/registratie onterecht blokkeren.
      LOGIN_RATE_LIMIT: "100000"
      REGISTER_RATE_LIMIT: "100000"
      # Kleine paginagrootte zodat "Meer laden" testbaar is met de seed-data.
      LIST_PAGE_SIZE: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate && npx prisma db push --skip-generate && npx prisma db seed
      - run: npx playwright install chromium --with-deps
      - run: npm run build
      # Smoke + de kritieke geld-loop. De prod-action-hang (issue #329) is afgedekt met de
      # watchdog in JobStatusButton; de wortel (route-specifieke response-stream-hang) blijft
      # open in het issue.
      - run: npx playwright test e2e/smoke.spec.ts e2e/cascade.spec.ts --project=ci --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            e2e/screenshots/
            playwright-report/
          retention-days: 7
