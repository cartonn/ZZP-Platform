<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Handslag</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: #eaf4fa;
        color: #005273;
        padding: 24px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0e1e28;
          color: #fafafa;
        }
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      .mark {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #ffffff;
        color: #d97757;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 28px;
        margin: 0 auto 20px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 20px;
        color: inherit;
        line-height: 1.5;
      }
      button {
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 8px;
        padding: 10px 18px;
        background: #0076a8;
        color: #fafafa;
        cursor: pointer;
        box-shadow: 0 3px 0 #005273;
        transition:
          transform 160ms ease,
          box-shadow 160ms ease;
      }
      button:focus-visible {
        outline: 3px solid #0076a8;
        outline-offset: 4px;
      }
      @media (hover: hover) and (pointer: fine) {
        button:hover {
          transform: translateY(-2px);
        }
      }
      button:active {
        transform: translateY(1px);
        box-shadow: 0 1px 0 #005273;
      }
      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">
        <svg
          width="42"
          height="42"
          viewBox="0 0 48 48"
          fill="none"
          stroke="currentColor"
          stroke-width="4"
          stroke-linecap="round"
          role="img"
          aria-label="Handslag"
        >
          <path d="M10.6 13h7a10 10 0 0 1 10 10v4" />
          <path d="M37.4 35h-7a10 10 0 0 1 -10 -10v-4" />
        </svg>
      </div>
      <h1>Je bent offline</h1>
      <p>
        Er is op dit moment geen internetverbinding. Zodra je weer online bent, kun je verdergaan
        waar je was gebleven.
      </p>
      <button onclick="location.reload()">Opnieuw proberen</button>
    </main>
  </body>
</html>
