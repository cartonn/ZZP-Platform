<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · ZZP Platform</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: #ffffff;
        color: #09090b;
        padding: 24px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0e0e11;
          color: #fafafa;
        }
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      .mark {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #18181b;
        color: #fafafa;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 28px;
        margin: 0 auto 20px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 20px;
        color: #71717a;
        line-height: 1.5;
      }
      button {
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 8px;
        padding: 10px 18px;
        background: #18181b;
        color: #fafafa;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        button {
          background: #fafafa;
          color: #18181b;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">Z</div>
      <h1>Je bent offline</h1>
      <p>
        Er is op dit moment geen internetverbinding. Zodra je weer online bent, kun je verdergaan
        waar je was gebleven.
      </p>
      <button onclick="location.reload()">Opnieuw proberen</button>
    </main>
  </body>
</html>
